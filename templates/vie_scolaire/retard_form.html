{% extends "base.html" %}

{% block title %}Déclarer un retard{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="{% url 'vie_scolaire:retard_list' %}" class="inline-flex items-center text-sm text-slate-500 hover:text-brand-600 mb-2">
            <i class="fa-solid fa-arrow-left mr-1.5"></i>Retour à l'historique
        </a>
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
            <span class="w-9 h-9 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center">
                <i class="fa-solid fa-clock"></i>
            </span>
            Déclarer un retard
        </h1>
    </div>

    <form method="post" class="bg-white rounded-2xl card-shadow p-6 sm:p-8 space-y-6">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                <i class="fa-solid fa-user text-slate-400 mr-1"></i>Élève <span class="text-rose-500">*</span>
            </label>
            <select name="student" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 bg-white">
                {% for s in students %}
                    <option value="{{ s.id }}">{{ s.user.get_full_name }} — {{ s.class_group|default:"—" }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                    <i class="fa-solid fa-calendar-day text-slate-400 mr-1"></i>Date <span class="text-rose-500">*</span>
                </label>
                <input type="date" name="date" required value="{{ today|date:'Y-m-d' }}"
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                    <i class="fa-solid fa-hourglass-half text-slate-400 mr-1"></i>Durée (minutes) <span class="text-rose-500">*</span>
                </label>
                <input type="number" name="duration_minutes" required min="1" max="300" value="10"
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                <i class="fa-solid fa-circle-question text-slate-400 mr-1"></i>Motif
            </label>
            <select name="motif" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 bg-white">
                {% for value, label in motif_choices %}
                    <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">
                <i class="fa-solid fa-pen text-slate-400 mr-1"></i>Précision (facultatif)
            </label>
            <input type="text" name="motif_detail" maxlength="255" placeholder="Ex : bus en retard, rendez-vous médical…"
                   class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500">
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
            <a href="{% url 'vie_scolaire:retard_list' %}" class="px-4 py-2.5 text-slate-600 hover:bg-slate-100 rounded-lg text-sm font-medium">Annuler</a>
            <button type="submit" class="inline-flex items-center gap-2 px-5 py-2.5 bg-brand-600 text-white rounded-lg hover:bg-brand-700 font-medium shadow-sm">
                <i class="fa-solid fa-check"></i> Déclarer le retard
            </button>
        </div>
    </form>
</div>
{% endblock %}
