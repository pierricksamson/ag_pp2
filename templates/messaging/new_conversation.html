{% extends "base.html" %}

{% block title %}Nouveau message{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{% url 'messaging:inbox' %}" class="inline-flex items-center text-sm text-slate-500 hover:text-brand-600 mb-2">
        <i class="fa-solid fa-arrow-left mr-1.5"></i>Retour à la messagerie
    </a>
    <h1 class="text-2xl font-bold text-slate-900">Nouveau message</h1>
</div>

<form method="post" class="bg-white rounded-2xl card-shadow p-6 max-w-2xl space-y-4">
    {% csrf_token %}
    <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Destinataire</label>
        <select name="recipient" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-brand-500 bg-white">
            <option value="">— Choisir —</option>
            {% for u in recipients %}
                <option value="{{ u.id }}">{{ u.get_full_name }} ({{ u.get_role_display }})</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Sujet (optionnel)</label>
        <input type="text" name="subject" maxlength="120" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-brand-500">
    </div>
    <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Message</label>
        <textarea name="body" rows="5" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-brand-500"></textarea>
    </div>
    <button type="submit" class="inline-flex items-center gap-2 px-4 py-2 bg-brand-600 text-white rounded-lg hover:bg-brand-700 font-medium shadow-sm">
        <i class="fa-solid fa-paper-plane"></i> Envoyer
    </button>
</form>
{% endblock %}
